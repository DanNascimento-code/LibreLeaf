[project]
name = "libreleaf"
version = "0.5.0"
description = "Ethical book discovery and cross-market price comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "fastapi>=0.118,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.37,<1",
]

[project.scripts]
libreleaf = "libreleaf.cli:main"
libreleaf-web = "libreleaf.web:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["libreleaf"]
omit = ["src/libreleaf/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/libreleaf/i18n.py" = ["E501"]
